name: Java Server CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'archiveat-java-server/**'
      - '.github/workflows/java-ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'archiveat-java-server/**'

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/archiveat-java
  JAVA_VERSION: 17

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      working-directory: ./archiveat-java-server
      run: chmod +x gradlew
    
    - name: Build with Gradle
      working-directory: ./archiveat-java-server
      run: ./gradlew clean build -x test
    
    - name: Run tests
      working-directory: ./archiveat-java-server
      run: ./gradlew test
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: java-build
        path: archiveat-java-server/build/libs/*.jar
        retention-days: 1

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract version
      id: version
      run: echo "VERSION=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./archiveat-java-server
        file: ./archiveat-java-server/Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
          ${{ env.DOCKER_IMAGE }}:latest
        build-args: |
          SENTRY_DSN=${{ secrets.SENTRY_DSN_JAVA }}
          SENTRY_ENVIRONMENT=production
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Output image tags
      run: |
        echo "Built and pushed:"
        echo "${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}"
        echo "${{ env.DOCKER_IMAGE }}:latest"

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_SSH_PORT || 22 }}
        script: |
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Navigate to project directory
          cd /app/archiveat
          
          # Create .env file with secrets
          cat > .env << EOF
          DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          SENTRY_DSN_JAVA=${{ secrets.SENTRY_DSN_JAVA }}
          SENTRY_DSN_PYTHON=${{ secrets.SENTRY_DSN_PYTHON }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=ap-northeast-2
          EOF
          
          # Docker login
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          
          # Pull latest images
          docker-compose pull java-server-1 java-server-2
          
          # Restart services (no down - zero downtime)
          docker-compose up -d --no-deps java-server-1 java-server-2
          
          # Wait for health check
          echo "⏳ Waiting for health checks..."
          sleep 15
          
          # Cleanup old images
          docker image prune -af --filter "until=24h"
          
          echo "✅ Deployment completed!"
    
    - name: Health check
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_SSH_PORT || 22 }}
        script: |
          echo "🔍 Running health checks..."
          
          # Check Java server 1
          if curl -f http://localhost:8080/actuator/health; then
            echo "✅ Java server is healthy"
          else
            echo "❌ Java server health check failed"
            docker logs archiveat-java-1 --tail 50
            exit 1
          fi
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Deployment failed! Check logs above."
        exit 1
